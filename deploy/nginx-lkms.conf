# Nginx site for LKMS. Replace school.example.in with the real domain, then see docs/DEPLOY.md step 8.
# Certbot adds the HTTPS (443) server block and certificate lines when it runs.

server {
    listen 80;
    listen [::]:80;
    server_name school.example.in;

    # Admission documents and photos are uploaded through the API (limit set in MAX_UPLOAD_SIZE_MB).
    client_max_body_size 10m;

    # The React app (built with `npm run build`).
    root /srv/lkms/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API and Django admin go to Gunicorn.
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django admin's CSS and JS (collected with `manage.py collectstatic`).
    location /static/ {
        alias /srv/lkms/backend/staticfiles/;
        expires 30d;
    }

    # Built JS and CSS have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a page of the React app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
