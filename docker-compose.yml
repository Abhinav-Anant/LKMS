# Local development services. The Django app runs on your machine and talks to these.
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lkms
      POSTGRES_USER: lkms
      POSTGRES_PASSWORD: lkms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lkms -d lkms"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
