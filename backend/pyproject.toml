[project]
name = "lkms-backend"
version = "0.1.0"
description = "Lotus Kids Management System - backend API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.6,<6",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "django-cors-headers>=4.8.0",
    "django-filter>=25.1",
    "django-jazzmin>=3.0.1",
    "drf-spectacular>=0.28.0",
    "dj-database-url>=2.3.0",
    "psycopg[binary]>=3.2",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
    "gunicorn>=23.0",
    "reportlab>=5.0.1",
    "segno>=1.6.6",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "-q"
markers = ["captcha: keep the public-form CAPTCHA switched on"]
